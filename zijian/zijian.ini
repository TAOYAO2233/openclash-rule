; ==============================================================================
; Subconverter 订阅转换自定义配置文件 (适配 OpenClash / Mihomo / Clash Meta)
; 基于 configdialy.yaml 结构定制生成
; ==============================================================================

[common]
; 是否开启规则生成器
enable_rule_generator=true
; 是否覆盖原订阅中的规则
overwrite_original_rules=true

; [可选] 基础模板文件，用于注入防 DNS 泄露的 dns、tun、sniffer 全局配置
; 如果你在 GitHub 或 Gist 托管了 base_template.yaml，可以取消下方注释并填入直链：
clash_rule_base=https://raw.githubusercontent.com/TAOYAO2233/openclash-rule/refs/heads/main/zijian/base_template.yaml

[custom]
; ==============================================================================
; 策略组配置 (Proxy Groups)
; 语法说明：组名`类型`节点匹配正则或[策略组引用]`测速网址`测速参数(间隔,超时,容差)
; ==============================================================================

; ---------- 1. 主节点选择与链式代理 ----------
custom_proxy_group=🔗 链式代理`select`[]🛫 前置节点`[]🛬 落地节点
custom_proxy_group=🏠 住宅链式代理`select`[]🛫 住宅前置节点`[]🏠 住宅IP
custom_proxy_group=🚀 节点选择`select`[]🔗 链式代理`[]🏠 住宅链式代理`[]🛫 前置节点`[]🛬 落地节点`[]🔯 香港故转`[]🔯 日本故转`[]♻️ 香港自动`[]♻️ 日本自动`[]♻️ 美国自动`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇺🇲 美国节点`[]🌐 全部节点`[]🎯 全球直连
custom_proxy_group=🏠 住宅代理`select`[]🏠 住宅链式代理`[]🔗 链式代理`[]🚀 节点选择

; ---------- 2. 特殊业务分组 ----------
custom_proxy_group=🔞 PikPak`select`(🇸🇬|新加坡|SG[A-Z]?|Singapore|狮城|原生)
custom_proxy_group=🔞🈲㊙️ SQ(R18)`select`[]🚀 节点选择`[]♻️ 自动选择`[]♻️ 香港自动`^(?!(.*(🇯🇵|JP|Japan|日本|东京|大阪|埼玉))).*$
custom_proxy_group=🍎 Apple`select`[]🎯 全球直连`[]🚀 节点选择
custom_proxy_group=🎯 全球直连`select`[]DIRECT

